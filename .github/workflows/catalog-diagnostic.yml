name: Catalog connectivity diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-connectivity-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: One public request without credentials or retries
        run: node scripts/catalog-diagnostic.js
